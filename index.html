<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0b111c">
<title>Reflect Clips – ניתוח שופטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b111c;--p1:#121a29;--p2:#18223a;--p3:#202c49;--ink:#eef2f9;--mu:#8e9ab3;--ln:#26324f;--pri:#3ecfb2;--pri-d:#0a3b33;--ok:#40c057;--bad:#fa5252;--mid:#fab005;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--p2);border:1px solid var(--ln);border-radius:9px;padding:7px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.btn{background:var(--pri);color:#04261f;border:0;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.s{background:var(--p2);color:var(--ink);border:1px solid var(--ln);font-weight:500}
.btn.s:hover{border-color:var(--pri)}
.btn.sm{padding:5px 10px;font-size:12.5px}.btn.ic{padding:6px 9px;min-width:34px}
.btn.on{background:var(--pri);color:#04261f;border-color:var(--pri)}
.btn.bad{background:#3b1d22;color:var(--bad);border:0}
.mu{color:var(--mu);font-size:12px}
/* header */
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(180deg,#141e31,#0f1727);border-bottom:1px solid var(--ln);flex-wrap:wrap;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.3px}
.brand svg{width:28px;height:28px}.brand span{color:var(--pri)}
.gname{font-weight:700;font-size:15px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
.sw{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.sw button{border:0;background:var(--p1);color:var(--mu);padding:7px 13px;font-weight:700;cursor:pointer}
.sw button.on{background:var(--pri);color:#04261f}
/* source bar */
.srcbar{display:flex;gap:8px;padding:10px 16px;background:var(--p1);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.srcbar input{flex:1;min-width:200px}
/* layout */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;padding:14px;align-items:start}
.left{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{background:#000;border-radius:var(--r);aspect-ratio:16/9;width:100%;position:relative;overflow:hidden;border:1px solid var(--ln)}
.stage .media{position:absolute;inset:0;transform-origin:center;transition:transform .08s}
.stage .media iframe,.stage .media video,.stage .media>div{width:100%;height:100%;border:0;display:block;background:#000}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);text-align:center;padding:20px;line-height:1.9}
.empty b{color:var(--ink);font-size:17px;display:block;margin-bottom:4px}
#dc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.stage.draw #dc{pointer-events:auto;cursor:crosshair;touch-action:none}
.zl{position:absolute;inset:0;z-index:2;display:none;cursor:grab;touch-action:none}
.stage.z .zl{display:block}
.badge{position:absolute;top:10px;right:10px;z-index:4;background:#000b;border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px;display:none}
.badge.show{display:block}
.ctrl{display:flex;gap:5px;align-items:center;flex-wrap:wrap;background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:8px}
.time{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;min-width:84px;text-align:center}
.sep{width:1px;height:24px;background:var(--ln);margin:0 3px}
.drawbar{display:none;gap:5px;align-items:center;flex-wrap:wrap;background:var(--p1);border:1px solid var(--pri);border-radius:var(--r);padding:8px}
.drawbar.show{display:flex}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatch.on{border-color:#fff}
.bar{height:26px;background:var(--p1);border-radius:9px;position:relative;cursor:pointer;overflow:hidden;border:1px solid var(--ln)}
.bar i{position:absolute;top:3px;bottom:3px;border-radius:3px;opacity:.9}.bar b{position:absolute;top:0;bottom:0;width:2px;background:#fff}
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tagb{border:0;border-radius:11px;padding:12px 8px;font-weight:800;cursor:pointer;color:#fff;position:relative;text-shadow:0 1px 2px #0006;font-size:14.5px}
.tagb kbd{position:absolute;top:3px;left:7px;font-size:10px;opacity:.8;font-family:inherit}
.tagb:active{transform:scale(.96)}
/* panel */
.right{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);display:flex;flex-direction:column;position:sticky;top:10px;max-height:calc(100vh - 20px)}
.rh{padding:12px;border-bottom:1px solid var(--ln);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rh h3{margin:0;font-size:16px;flex:1}
.list{overflow:auto;flex:1;padding:8px;min-height:120px}
.clip{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:9px 10px;margin-bottom:8px}
.clip.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.clip .top{display:flex;align-items:center;gap:8px}
.play{background:var(--pri);color:#04261f;border:0;border-radius:50%;width:34px;height:34px;font-size:14px;cursor:pointer;flex:none;font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.clip .nm{font-weight:800;flex:1;font-size:14.5px}.clip .tm{color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums}
.vd{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;align-items:center}
.vd button{border:1px solid var(--ln);background:var(--p1);border-radius:20px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--mu)}
.vd button.ok.on{background:#173d24;border-color:var(--ok);color:var(--ok)}
.vd button.bad.on{background:#3b1d22;border-color:var(--bad);color:var(--bad)}
.vd button.mid.on{background:#3d3214;border-color:var(--mid);color:var(--mid)}
.vd select{padding:3px 6px;font-size:12.5px;border-radius:20px}
.clip textarea{width:100%;margin-top:7px;padding:6px 8px;font-size:13px;resize:vertical;min-height:34px}
.more{display:none;gap:4px;margin-top:7px;flex-wrap:wrap;align-items:center}
.clip.open .more{display:flex}
.more input{width:64px;padding:3px 5px;font-size:12px}
.foot{padding:10px;border-top:1px solid var(--ln);display:flex;gap:6px;flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-start;justify-content:center;padding:28px 10px;z-index:50;overflow:auto}
.box{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:18px;width:100%;max-width:760px}
.box h3{margin:0 0 10px;font-size:18px}
.box table{width:100%;border-collapse:collapse}.box td,.box th{padding:5px;text-align:right;vertical-align:middle}.box th{color:var(--mu);font-weight:500;font-size:12px}
.box td input{width:100%}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fg label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}.fg input{width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:12px}.kpi b{display:block;font-size:24px}.kpi span{color:var(--mu);font-size:12px}
.meter{height:8px;background:var(--p3);border-radius:4px;overflow:hidden;display:flex}.meter i{display:block;height:100%}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--pri);color:#04261f;font-weight:800;padding:10px 18px;border-radius:11px;z-index:99;box-shadow:0 8px 24px #0008;max-width:90vw;text-align:center}
.prog{position:fixed;inset:0;background:#000c;z-index:60;display:flex;align-items:center;justify-content:center}
.prog .box{max-width:420px;text-align:center}
.pbar{height:10px;background:var(--p3);border-radius:5px;overflow:hidden;margin:12px 0}.pbar i{display:block;height:100%;background:var(--pri);width:0}
/* read-only viewer */
body.ro .ed{display:none!important}
.rohead{display:none}body.ro .rohead{display:block}.left .rohead{max-width:none}
@media(max-width:960px){
 .wrap{grid-template-columns:1fr;padding:10px}
 .right{position:static;max-height:none}
 .stage{position:sticky;top:0;z-index:20;box-shadow:0 8px 18px #000a}
 .gname{max-width:60vw}
}
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="8" fill="#3ecfb2"/><path d="M10 22V10h6.5a4 4 0 0 1 0 8H13m3.3 0L22 22" stroke="#04261f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Reflect <span>Clips</span></div>
  <div class="gname" id="gname"></div>
  <div class="sp"></div>
  <div class="sw ed"><button id="sw-handball" onclick="setSport('handball')">🤾 כדוריד</button><button id="sw-football" onclick="setSport('football')">⚽ כדורגל</button></div>
  <button class="btn s sm ed" onclick="openGame()">📋 פרטי משחק</button>
  <button class="btn s sm ed" onclick="openSettings()">⚙️ אירועים</button>
  <button class="btn s sm" onclick="openReport()">📊 דוח</button>
</header>
<div class="srcbar ed">
  <input id="url" placeholder="הדבק קישור יוטיוב של המשחק" inputmode="url">
  <button class="btn" onclick="loadYT()">טען</button>
  <label class="btn s" style="cursor:pointer">📁 קובץ וידאו<input type="file" accept="video/*" hidden onchange="loadFile(this.files[0])"></label>
</div>
<div class="wrap">
  <div class="left">
    <div class="stage" id="stage">
      <div class="media" id="media"><div class="empty" id="emptyMsg"><b>טען משחק כדי להתחיל</b>הדבק קישור יוטיוב או בחר קובץ וידאו.<br>לחץ על כפתורי האירועים תוך כדי צפייה – כל לחיצה יוצרת קליפ.</div></div>
      <canvas id="dc"></canvas>
      <div class="badge" id="badge"></div>
    </div>
    <div class="ctrl">
      <button class="btn s ic" title="10 שניות אחורה" onclick="skip(-10)">⏪</button>
      <button class="btn s ic" title="פריים אחורה" onclick="frame(-1)">‹|</button>
      <button class="btn ic" style="min-width:52px" onclick="togglePlay()">▶︎❚❚</button>
      <button class="btn s ic" title="פריים קדימה" onclick="frame(1)">|›</button>
      <button class="btn s ic" title="10 שניות קדימה" onclick="skip(10)">⏩</button>
      <div class="time" id="tnow">00:00</div>
      <select id="rate" onchange="setRate(+this.value)" title="מהירות"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <span class="sep"></span>
      <button class="btn s ic" onclick="zoomBy(-0.5)" title="הקטן">−</button><span id="zv" class="mu" style="min-width:30px;text-align:center">1×</span><button class="btn s ic" onclick="zoomBy(0.5)" title="הגדל">+</button><button class="btn s ic" onclick="zoomReset()" title="גודל רגיל">↺</button>
      <span class="sep ed"></span>
      <button class="btn s ed" id="drawBtn" onclick="toggleDraw()">✏️ ציור</button>
    </div>
    <div class="drawbar ed" id="drawbar">
      <b style="margin-left:4px">ציור:</b>
      <button class="btn s sm tool on" data-t="arrow" onclick="setTool('arrow')">➜ חץ</button>
      <button class="btn s sm tool" data-t="circle" onclick="setTool('circle')">◯ עיגול</button>
      <button class="btn s sm tool" data-t="line" onclick="setTool('line')">／ קו</button>
      <button class="btn s sm tool" data-t="free" onclick="setTool('free')">〰 חופשי</button>
      <span class="sep"></span>
      <span class="swatch on" style="background:#ffd43b" onclick="setColor('#ffd43b',this)"></span>
      <span class="swatch" style="background:#ff6b6b" onclick="setColor('#ff6b6b',this)"></span>
      <span class="swatch" style="background:#3ecfb2" onclick="setColor('#3ecfb2',this)"></span>
      <span class="swatch" style="background:#ffffff" onclick="setColor('#ffffff',this)"></span>
      <span class="sep"></span>
      <button class="btn s sm" onclick="undoDraw()">↶ בטל</button>
      <button class="btn bad sm" onclick="clearDraw()">🗑 נקה</button>
      <span class="mu">הציור נשמר כ"תמונה קפואה" בקליפ הנבחר – בהפעלה הקליפ יעצור 3 שניות ויציג אותו.</span>
    </div>
    <div class="bar" id="tl" onclick="tlClick(event)"></div>
    <div class="tags ed" id="tags"></div>
    <div class="rohead box" id="rohead"></div>
  </div>
  <div class="right">
    <div class="rh">
      <h3>קליפים (<span id="cnt">0</span>)</h3>
      <select id="flt" onchange="drawList()"></select>
      <select id="fv" onchange="drawList()"><option value="">כל ההחלטות</option><option value="ok">✔ נכון</option><option value="bad">✖ שגוי</option><option value="mid">? גבולי</option><option value="none">ללא ציון</option></select>
      <select id="fw" onchange="drawList()"></select>
    </div>
    <div class="list" id="list"></div>
    <div class="foot">
      <button class="btn" onclick="playReel()">▶︎ תקציר</button>
      <button class="btn s" onclick="stopReel()">■</button>
      <button class="btn s" onclick="copyLinks()">📋 קישורים</button>
      <button class="btn s ed" onclick="openShare()">🔗 שיתוף</button>
      <button class="btn s ed" onclick="exportMenu()">🎬 ייצוא</button>
      <label class="btn s ed" style="cursor:pointer">📂 פתח<input type="file" accept=".json" hidden onchange="importJSON(this.files[0])"></label>
    </div>
  </div>
</div>
<script>
// ================= Defaults =================
const DEF_HB=[
 {name:'צעדים',color:'#0ca678',key:'1',pre:8,post:3,desc:'שחקן עשה יותר משלושה צעדים עם הכדור בלי לכדרר. שריקה, המשחק נעצר, השופט מראה סיבוב ידיים.'},
 {name:'2 דקות',color:'#e67700',key:'2',pre:15,post:5,desc:'שתי שריקות, השופט מרים יד ומראה שתי אצבעות – שחקן מורחק ל-2 דקות.'},
 {name:'שער',color:'#2f9e44',key:'3',pre:8,post:3,desc:''},
 {name:'7 מטר',color:'#1c7ed6',key:'4',pre:10,post:4,desc:''},
 {name:'עבירת תוקף',color:'#7048e8',key:'5',pre:8,post:3,desc:''},
 {name:'כרטיס צהוב',color:'#d9a400',key:'6',pre:10,post:4,desc:''},
 {name:'כרטיס אדום',color:'#e03131',key:'7',pre:12,post:5,desc:''},
 {name:'משחק פסיבי',color:'#868e96',key:'8',pre:20,post:3,desc:''},
 {name:'החלטה שגויה',color:'#c2255c',key:'9',pre:10,post:5,desc:''},
 {name:'מיקום שופט',color:'#5c7cfa',key:'0',pre:6,post:6,desc:''}];
const DEF_FB=[
 {name:'עבירה',color:'#7048e8',key:'1',pre:8,post:4,desc:'שריקה, השופט מצביע עם יד מושטת לכיוון הקבוצה שמקבלת בעיטה חופשית.'},
 {name:'לא עבירה',color:'#0ca678',key:'2',pre:8,post:4,desc:'מגע / מאבק בלי שריקה – השופט מסמן להמשיך לשחק (או יתרון: שתי ידיים קדימה).'},
 {name:'צהוב',color:'#d9a400',key:'3',pre:12,post:6,desc:'השופט מרים כרטיס צהוב מעל הראש.'},
 {name:'אדום',color:'#e03131',key:'4',pre:15,post:8,desc:'השופט מרים כרטיס אדום מעל הראש, שחקן יוצא מהמגרש.'},
 {name:'פנדל',color:'#e67700',key:'5',pre:12,post:6,desc:'שריקה, השופט מצביע לנקודת הפנדל.'},
 {name:'DOGSO',color:'#c2255c',key:'6',pre:15,post:8,desc:'מניעת הזדמנות ברורה להבקיע – עבירה על שחקן בדרך לשער / לבד מול השוער.'},
 {name:'SPA',color:'#1c7ed6',key:'7',pre:12,post:6,desc:'עצירת התקפה מבטיחה – עבירה שעוצרת התקפה מסוכנת (בדרך כלל צהוב).'}];
const DEFS={handball:DEF_HB,football:DEF_FB};
const CREW={handball:['שופט 1','שופט 2','שניהם'],football:['שופט','עוזר 1','עוזר 2','שופט רביעי','VAR']};
const VD={ok:'✔ נכון',bad:'✖ שגוי',mid:'? גבולי'};
const VER=5;
const clone=o=>JSON.parse(JSON.stringify(o));

// ================= State =================
let RO=false,P=null;
function blank(){return {v:VER,name:'',date:'',comp:'',sport:'handball',src:null,crew:{},sets:{handball:clone(DEF_HB),football:clone(DEF_FB)},clips:[]}}
function migrate(x){
  if(!x)return blank();
  if(!x.sets){x.sets={handball:x.tags||clone(DEF_HB),football:clone(DEF_FB)}}
  if(x.tagsVer===3)x.sets.football=clone(DEF_FB);
  if(!x.sets.football)x.sets.football=clone(DEF_FB);
  x.sport=x.sport||'handball';x.crew=x.crew||{};x.clips=(x.clips||[]).map(c=>Object.assign({verdict:'',who:'',note:'',ann:null},c));
  delete x.tags;delete x.tagsVer;x.v=VER;return x;
}
try{P=migrate(JSON.parse(localStorage.getItem('reflect_clips')||'null'))}catch(e){P=blank()}
const tags=()=>P.sets[P.sport];
function save(){if(RO)return;try{localStorage.setItem('reflect_clips',JSON.stringify(P))}catch(e){}}

// ================= Utils =================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{t=Math.max(0,t||0);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60);return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0')};
const parseT=s=>{const p=String(s).trim().split(':').map(Number);if(!p.length||p.some(isNaN))return null;return p.reduce((a,b)=>a*60+b,0)};
const uid=()=>Math.random().toString(36).slice(2,8);
function toast(m,ms){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||1800)}
function modal(h){closeM();const m=document.createElement('div');m.className='modal';m.id='mdl';m.innerHTML=`<div class="box">${h}</div>`;m.onclick=e=>{if(e.target===m)closeM()};document.body.appendChild(m)}
function closeM(){const m=$('#mdl');if(m)m.remove()}
const clip=id=>P.clips.find(c=>c.id===id);
const sorted=()=>P.clips.slice().sort((a,b)=>a.start-b.start);
function copyText(t,okMsg){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(okMsg||'הועתק')).catch(()=>modal(`<h3>העתקה</h3><p class="mu">סמן הכל והעתק:</p><textarea style="width:100%;height:240px" readonly onclick="this.select()">${esc(t)}</textarea><p><button class="btn s" onclick="closeM()">סגירה</button></p>`))}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const safe=s=>String(s).replace(/[\\/:*?"<>|]/g,'-');

// ================= Player =================
const player={kind:null,yt:null,v:null,
 time(){try{return this.kind==='yt'?this.yt.getCurrentTime():this.v?this.v.currentTime:0}catch(e){return 0}},
 dur(){try{return this.kind==='yt'?this.yt.getDuration():this.v?this.v.duration||0:0}catch(e){return 0}},

const Z={z:1,x:0,y:0};

  Z.x=Math.max(-mx,Math.min(mx,Z.x));Z.y=Math.max(-my,Math.min(my,Z.y));
  m.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.z})`;st.classList.toggle('z',Z.z>1);$('#zv').textContent=(Math.round(Z.z*10)/10)+'×'}
function zoomBy(d){Z.z=Math.max(1,Math.min(5,Z.z+d));if(Z.z===1)Z.x=Z.y=0;zApply()}
function zoomReset(){Z.z=1;Z.x=Z.y=0;zApply()}
(function(){const st=$('#stage');const o=document.createElement('div');o.className='zl';st.appendChild(o);
  const pts=new Map();let start=null,moved=false;
  o.addEventListener('pointerdown',e=>{o.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;start={z:Z.z,x:Z.x,y:Z.y,pts:new Map(pts)}});
  o.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...pts.values()],b=[...start.pts.values()];
    if(a.length>=2&&b.length>=2){const d1=Math.hypot(b[0].x-b[1].x,b[0].y-b[1].y)||1,d2=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);Z.z=Math.max(1,Math.min(5,start.z*d2/d1));moved=true}
    else if(b.length){const dx=a[0].x-b[0].x,dy=a[0].y-b[0].y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;Z.x=start.x+dx;Z.y=start.y+dy}zApply()});
  const up=e=>{pts.delete(e.pointerId);if(!pts.size&&!moved)togglePlay();start={z:Z.z,x:Z.x,y:Z.y,pts:new Map(pts)}};
  o.addEventListener('pointerup',up);o.addEventListener('pointercancel',up);o.addEventListener('dblclick',zoomReset);
  st.addEventListener('wheel',e=>{if(Z.z>1||e.ctrlKey){e.preventDefault();zoomBy(e.deltaY<0?0.25:-0.25)}},{passive:false});
})();

    x.drawImage(v,0,0,W,H);
    if(frozenAnn)drawShapes(x,frozenAnn.shapes,W,H);
    if(curC&&performance.now()<titleUntil){const h=font*2.1;x.fillStyle='rgba(8,12,20,.78)';x.fillRect(0,H-h-H*0.05,W,h);x.fillStyle=curC.color;x.fillRect(W-W*0.012,H-h-H*0.05,W*0.012,h);
      x.direction='rtl';x.textAlign='right';x.fillStyle='#fff';x.font=`800 ${font}px Heebo,Arial`;
      x.fillText(`${curC.tag}  ·  דקה ${fmt(curC.mark)}${curC.verdict?'  ·  '+VD[curC.verdict]:''}`,W-W*0.03,H-H*0.05-h*0.35)}
    x.direction='ltr';x.textAlign='left';x.font=`700 ${font*0.55}px Heebo,Arial`;x.fillStyle='rgba(255,255,255,.55)';x.fillText('Reflect',W*0.015,H*0.05);
  }
  let raf;const loop=()=>{paint();raf=requestAnimationFrame(loop)};
  const cs=cv.captureStream(30);const stream=new MediaStream([...cs.getVideoTracks(),...at]);
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const warm=rec=>Promise.race([new Promise(r=>rec.addEventListener('dataavailable',r,{once:true})),sleep(3000)]).then(()=>sleep(300));
  async function recordList(items,name){
    const ch=[];const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.min(16e6,Math.max(6e6,W*H*6)),audioBitsPerSecond:192000});
    rec.ondataavailable=e=>e.data.size&&ch.push(e.data);const stopped=new Promise(r=>rec.onstop=r);
    v.pause();v.playbackRate=1;v.muted=false;let started=false;
    for(const c of items){if(cancelExp)break;
      await waitSeek(v,c.start);curC=c;
      if(merge){card={title:c.tag,sub:`דקה ${fmt(c.mark)}${c.verdict?'  ·  '+VD[c.verdict]:''}${c.who?'  ·  '+crewName(c.who):''}`,color:c.color};paint();
        if(!started){rec.start(250);started=true}else rec.resume();prog(`${c.tag} · דקה ${fmt(c.mark)}`);await sleep(2000);done+=2;rec.pause();card=null}
      c._fz=false;const t0=v.currentTime;await v.play();await new Promise(r=>{const st=performance.now();const ck=()=>{if(v.currentTime>t0+0.03||performance.now()-st>3000)r();else requestAnimationFrame(ck)};ck()});titleUntil=performance.now()+3000;
      if(!started){rec.start(250);started=true}else rec.resume();
      await new Promise(res=>{const h=()=>{if(cancelExp){v.removeEventListener('timeupdate',h);return res()}
          prog(`${c.tag} · ${fmt(v.currentTime)} / ${fmt(c.end)}`);
          if(c.ann&&c.ann.shapes.length&&!c._fz&&v.currentTime>=c.ann.t){c._fz=true;v.pause();frozenAnn=c.ann;setTimeout(()=>{frozenAnn=null;done+=3;v.play()},3000)}
          if(v.currentTime>=c.end){v.removeEventListener('timeupdate',h);res()}};v.addEventListener('timeupdate',h)});
      v.pause();done+=c.end-c.start;rec.pause();
    }
    rec.stop();await stopped;
    if(!cancelExp)dl(new Blob(ch,{type:mime.split(';')[0]}),name+'.'+ext);
  }
  loop();
  try{
    if(merge)await recordList(list,safe(`${P.name||'משחק'} - תקציר`));
    else for(const c of list){if(cancelExp)break;const n=sorted().indexOf(c)+1;await recordList([c],safe(`${P.name||'משחק'} - ${String(n).padStart(2,'0')} ${c.tag} דקה ${fmt(c.mark).replace(/:/g,'-')}`));await sleep(400)}
  }catch(e){toast('שגיאה בייצוא: '+e.message,4000)}
  cancelAnimationFrame(raf);try{mixAc&&mixAc.close()}catch(e){}pw.remove();toast(cancelExp?'הייצוא בוטל':'הייצוא הסתיים ✓',2500);
}

// ================= Links / share / report =================
function ytLink(c){return 'https://www.youtube.com/embed/'+P.src.id+'?start='+Math.floor(c.start)+'&end='+Math.ceil(c.end)+'&autoplay=1'}
function linksText(){const yt=P.src&&P.src.type==='yt';
  return filtered().map(c=>`${c.tag} – דקה ${fmt(c.mark)}\n${yt?ytLink(c):(P.src?P.src.name:'')}`).join('\n\n')}
function copyLinks(){if(!filtered().length)return toast('אין קליפים');copyText(linksText(),'הקישורים הועתקו – הדבק בוואטסאפ')}
async function pack(obj){const s=new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(s).arrayBuffer());
  let bin='';buf.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function unpack(str){const bin=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const buf=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(s).text())}
const rnd=n=>Math.round(n*10)/10;
async function shareURL(who){
  const cl=sorted().filter(c=>!who||c.who===who||c.who==='שניהם');
  const o={n:P.name,d:P.date,m:P.comp,s:P.sport,y:P.src&&P.src.type==='yt'?P.src.id:'',w:P.crew,f:who||'',
    c:cl.map(c=>[c.tag,c.color,rnd(c.start),rnd(c.end),rnd(c.mark),c.verdict||'',c.who||'',c.note||'',c.ann?{t:rnd(c.ann.t),s:c.ann.shapes.map(s=>({t:s.t,c:s.c,p:(s.t==='free'?s.p.filter((_,i)=>i%2===0||i===s.p.length-1):s.p).map(q=>[Math.round(q.x*1000),Math.round(q.y*1000)])}))}:0])};
  return location.origin+location.pathname+'#v='+(await pack(o));
}
function openShare(){
  if(!P.clips.length)return toast('אין קליפים לשתף');
  const yt=P.src&&P.src.type==='yt';
  const people=CREW[P.sport].filter(r=>r!=='שניהם');
  modal(`<h3>🔗 שיתוף עם שופטים</h3>
  ${yt?'':'<p style="color:var(--mid)">⚠️ הקישור עובד רק למשחק שנטען מיוטיוב. למשחק מקובץ – ייצא קליפים כ-MP4 ושלח אותם.</p>'}
  <p class="mu">כל קישור פותח דף צפייה (בלי אפשרות עריכה) עם הקליפים, ההחלטות, ההערות והציורים. אפשר לשלוח בוואטסאפ.</p>
  <div style="display:flex;flex-direction:column;gap:8px">
   <button class="btn" onclick="doShare('')">📋 העתק קישור לכל הקליפים</button>
   ${people.map(r=>`<button class="btn s" onclick="doShare('${esc(r)}')">📋 קישור אישי ל${esc(crewName(r))}</button>`).join('')}
  </div><p><button class="btn s" onclick="closeM()">סגירה</button></p>`);
}
async function doShare(who){try{const u=await shareURL(who);const n=sorted().filter(c=>!who||c.who===who||c.who==='שניהם').length;
  copyText(`${P.name||'ניתוח משחק'}${who?' – '+crewName(who):''}\n${n} קליפים לצפייה:\n${u}`,'הקישור הועתק – הדבק בוואטסאפ')}catch(e){toast('הדפדפן לא תומך ביצירת קישור')}}
function stats(list){const by={};list.forEach(c=>{const k=c.tag;by[k]=by[k]||{n:0,ok:0,bad:0,mid:0,color:c.color};by[k].n++;if(c.verdict)by[k][c.verdict]++});
  const v={ok:0,bad:0,mid:0};list.forEach(c=>c.verdict&&v[c.verdict]++);const graded=v.ok+v.bad+v.mid;return {by,v,graded,acc:graded?Math.round(v.ok/graded*100):null}}
function reportHTML(list){const s=stats(list);
  return `<div class="kpis"><div class="kpi"><b>${list.length}</b><span>קליפים</span></div><div class="kpi"><b style="color:var(--ok)">${s.acc==null?'—':s.acc+'%'}</b><span>החלטות נכונות</span></div>
  <div class="kpi"><b style="color:var(--ok)">${s.v.ok}</b><span>נכון</span></div><div class="kpi"><b style="color:var(--bad)">${s.v.bad}</b><span>שגוי</span></div><div class="kpi"><b style="color:var(--mid)">${s.v.mid}</b><span>גבולי</span></div></div>
  <table><tr><th>אירוע</th><th>כמות</th><th>נכון</th><th>שגוי</th><th>גבולי</th><th style="width:30%"></th></tr>
  ${Object.entries(s.by).map(([k,o])=>`<tr><td><span class="dot" style="display:inline-block;background:${o.color};margin-left:6px"></span>${esc(k)}</td><td>${o.n}</td><td>${o.ok}</td><td>${o.bad}</td><td>${o.mid}</td>
  <td><div class="meter"><i style="width:${o.ok/o.n*100}%;background:var(--ok)"></i><i style="width:${o.bad/o.n*100}%;background:var(--bad)"></i><i style="width:${o.mid/o.n*100}%;background:var(--mid)"></i></div></td></tr>`).join('')}</table>`}
function reportText(){const cl=sorted(),s=stats(cl);
  let t=`📊 ${P.name||'ניתוח משחק'}${P.date?' · '+P.date:''}${P.comp?' · '+P.comp:''}\n`;
  const crew=CREW[P.sport].filter(r=>P.crew[r]).map(r=>`${r}: ${P.crew[r]}`).join(' | ');if(crew)t+=crew+'\n';
  t+=`\nקליפים: ${cl.length} | נכון: ${s.v.ok} | שגוי: ${s.v.bad} | גבולי: ${s.v.mid}${s.acc!=null?' | דיוק: '+s.acc+'%':''}\n`;
  t+=Object.entries(s.by).map(([k,o])=>`• ${k}: ${o.n} (✔${o.ok} ✖${o.bad} ?${o.mid})`).join('\n');
  t+='\n\n'+cl.map((c,i)=>`${i+1}. ${c.tag} – דקה ${fmt(c.mark)}${c.verdict?' – '+VD[c.verdict]:''}${c.who?' – '+c.who:''}${c.note?'\n   '+c.note:''}`).join('\n');return t}
function openReport(){
  const people=CREW[P.sport].filter(r=>r!=='שניהם'&&P.clips.some(c=>c.who===r||c.who==='שניהם'));
  modal(`<h3>📊 דוח משחק</h3><div class="mu">${esc(P.name||'')}${P.date?' · '+esc(P.date):''}${P.comp?' · '+esc(P.comp):''}</div>
  ${reportHTML(sorted())}
  ${people.map(r=>{const l=sorted().filter(c=>c.who===r||c.who==='שניהם');const s=stats(l);return `<div style="margin-top:12px"><b>${esc(crewName(r))}</b> <span class="mu">· ${l.length} קליפים · דיוק ${s.acc==null?'—':s.acc+'%'}</span></div>`}).join('')}
  <p class="ed"><button class="btn" onclick="copyText(reportText(),'הדוח הועתק')">📋 העתק דוח כטקסט</button> <button class="btn s" onclick="closeM()">סגירה</button></p><p class="rohead"><button class="btn s" onclick="closeM()">סגירה</button></p>`);
}

  <hr style="border-color:var(--ln)">

function drawHead(){$('#gname').textContent=P.name||'';['handball','football'].forEach(k=>{const b=document.getElementById('sw-'+k);if(b)b.className=P.sport===k?'on':''})}

// ================= Keyboard =================
let inMark=null;
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||$('#mdl'))return;const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();togglePlay();return}
  if(e.key==='ArrowLeft'){e.preventDefault();skip(-2);return}if(e.key==='ArrowRight'){e.preventDefault();skip(2);return}
  if(k===','){frame(-1);return}if(k==='.'){frame(1);return}
  if(k==='+'||k==='='){zoomBy(0.5);return}if(k==='-'){zoomBy(-0.5);return}
  if(RO)return;
  if(k==='d'||k==='ג'){toggleDraw();return}
  if(k==='i'||k==='ן'){inMark=player.time();toast('התחלה: '+fmt(inMark));return}
  if((k==='o'||k==='ם')&&inMark!=null){const o=player.time();if(o>inMark)addClip(-1,inMark,o);inMark=null;return}
  const i=tags().findIndex(t=>t.key&&t.key===k);if(i>=0){e.preventDefault();addClip(i)}
});

async function bootViewer(h){
  try{const o=await unpack(h.slice(3));RO=true;document.body.classList.add('ro');$('#emptyMsg').innerHTML='<b>טוען את המשחק…</b>לחץ ▶︎ ליד קליפ כדי לצפות בו.';
    P=blank();Object.assign(P,{name:o.n,date:o.d,comp:o.m,sport:o.s||'handball',crew:o.w||{},src:o.y?{type:'yt',id:o.y}:null,
      clips:o.c.map(a=>({id:uid(),tag:a[0],color:a[1],start:a[2],end:a[3],mark:a[4],verdict:a[5],who:a[6],note:a[7],ann:a[8]?{t:a[8].t,shapes:a[8].s.map(s=>({t:s.t,c:s.c,p:s.p.map(q=>({x:q[0]/1000,y:q[1]/1000}))}))}:null}))});
    $('#rohead').innerHTML=`<h3 style="margin:0">${esc(P.name||'ניתוח משחק')}${o.f?' – '+esc(crewName(o.f)):''}</h3><div class="mu">${esc(P.date||'')}${P.comp?' · '+esc(P.comp):''} · לחץ ▶︎ ליד קליפ, או "תקציר" לצפייה רציפה</div>${reportHTML(P.clips)}`;
    boot();if(P.src)loadYT(P.src.id);
  }catch(e){RO=false;document.body.classList.remove('ro');toast('קישור שיתוף לא תקין',3000);boot()}
}
